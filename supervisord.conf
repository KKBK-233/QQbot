; 使用本地进程管理器统一启动 QQ、SnowLuma 和麦麦。
[unix_http_server]
file=/home/qqbot/QQbot/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/home/qqbot/QQbot/logs/supervisor.log
pidfile=/home/qqbot/QQbot/run/supervisor.pid
childlogdir=/home/qqbot/QQbot/logs
environment=HOME="/home/qqbot",DISPLAY=":0",XDG_RUNTIME_DIR="/home/qqbot/QQbot/run/xdg",SNOWLUMA_HOOK_RUNTIME_DIR="/home/qqbot/QQbot/run/xdg",TZ="Asia/Shanghai"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/qqbot/QQbot/run/supervisor.sock

[program:qq]
command=/usr/bin/dbus-run-session -- /usr/bin/qq --no-sandbox --disable-gpu --disable-software-rasterizer --disable-gpu-compositing
directory=/home/qqbot
priority=10
autostart=true
; QQ 异常退出后等待人工检查，避免连续拉起触发登录。
autorestart=false
startretries=0
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/home/qqbot/QQbot/logs/qq.log
redirect_stderr=true

[program:deepseek-direct]
command=/usr/bin/python3 /mnt/d/code/web/QQbot/deepseek-windows-direct.py
directory=/home/qqbot/QQbot
environment=WSL_INTEROP="/run/WSL/1_interop"
priority=24
autostart=true
autorestart=unexpected
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/home/qqbot/QQbot/logs/deepseek-direct.log
redirect_stderr=true

[program:snowluma]
command=/home/qqbot/QQbot/SnowLuma/node /home/qqbot/QQbot/SnowLuma/index.mjs
directory=/home/qqbot/QQbot/SnowLuma
environment=SNOWLUMA_HOOK_AUTOLOAD="1",SNOWLUMA_ACCEPT_EULA="1",SNOWLUMA_ACCEPT_PRIVACY="1"
priority=20
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/home/qqbot/QQbot/logs/snowluma.log
redirect_stderr=true

[program:maibot]
command=/bin/bash /home/qqbot/QQbot/run-maibot.sh
directory=/home/qqbot/QQbot/MaiBot
; DeepSeek使用独立2082本机通道，由Windows连接官方API；其他HTTP服务仍使用2081。
; 使用发行版常驻互操作通道，避免继承已失效的启动终端通道。
environment=WSL_INTEROP="/run/WSL/1_interop",HTTP_PROXY="http://127.0.0.1:2081",HTTPS_PROXY="http://127.0.0.1:2081",NO_PROXY="127.0.0.1,localhost,::1,api.deepseek.com"
priority=30
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/home/qqbot/QQbot/logs/maibot.log
redirect_stderr=true

[program:model-proxy]
command=/usr/bin/python3 /mnt/d/code/web/QQbot/wsl-proxy-bridge.py
directory=/home/qqbot/QQbot
environment=WSL_INTEROP="/run/WSL/1_interop"
priority=25
autostart=true
autorestart=unexpected
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/home/qqbot/QQbot/logs/model-proxy.log
redirect_stderr=true

; ChatGPT 计划登录页仅监听回环地址，凭据与 Codex 完全分开保存。
[program:chatgpt-plan-login]
command=/home/qqbot/QQbot/MaiBot/.venv/bin/python /home/qqbot/QQbot/chatgpt-plan/login_server.py
directory=/home/qqbot/QQbot/chatgpt-plan
environment=HTTP_PROXY="http://127.0.0.1:2081",HTTPS_PROXY="http://127.0.0.1:2081",NO_PROXY="127.0.0.1,localhost,::1"
priority=26
autostart=true
autorestart=unexpected
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/home/qqbot/QQbot/logs/chatgpt-plan-login.log
redirect_stderr=true
